# Foreman Self-Service Portal - production defaults
#
# PostgreSQL stays external. Redis is deployed by default and can be disabled
# in favor of an external service. Connection URLs remain in the app Secret.

nameOverride: ""
fullnameOverride: ""

image:
  repository: registry.example.com/foreman-selfservice
  tag: "1.1.0"
  # Prefer an immutable digest in production. When set, digest takes precedence
  # over tag, e.g. sha256:abc123...
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# This Secret must exist before `helm install` because the migration hook runs
# before ordinary chart resources are created.
secrets:
  existingSecret: foreman-selfservice-secrets

# Single-node Redis for sessions and Celery. Keep persistence enabled to retain
# queued jobs across Pod restarts. Use an external HA Redis for higher availability.
redis:
  enabled: true
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  # Pre-create this Secret with a `users.acl` key containing an ACL line such as
  # `user default on >LONG_RANDOM_PASSWORD ~* &* +@all`.
  existingSecret: foreman-selfservice-redis-auth
  port: 6379
  # Leave headroom below resources.limits.memory for Redis overhead.
  maxmemory: 384mb
  persistence:
    enabled: true
    size: 8Gi
    storageClass: "" # Empty selects the cluster's default StorageClass.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

config:
  portalHostname: selfservice.example.com
  sessionCookieSecure: true
  trustProxyHeaders: true

  auth:
    defaultProvider: entra
    enableEntra: true
    enableLdap: true
    enableLocal: true
    allowIdentityAutoLink: false

  entra:
    tenantId: ""
    clientId: ""
    redirectUri: https://selfservice.example.com/auth/entra/callback
    autoProvision: true

  ldap:
    uri: ldaps://ad.example.com:636
    baseDn: DC=example,DC=com
    bindDn: CN=svc_portal,OU=Service Accounts,DC=example,DC=com
    userFilter: '(&(objectClass=user)(sAMAccountName={username}))'
    usernameAttribute: sAMAccountName
    emailAttribute: mail
    displayNameAttribute: displayName
    tlsValidate: true
    autoProvision: true

  foreman:
    url: https://foreman.example.com
    username: ""
    verifyTls: true
    timeoutSeconds: 30
    reconcileIntervalSeconds: 5
    mock: false

  localAuth:
    lockoutAttempts: 5
    lockoutMinutes: 15

# Optional corporate CA bundle for Foreman TLS verification.
# Create this ConfigMap before installing the chart.
foremanCa:
  existingConfigMap: ""
  key: foreman-ca.pem

# Chiklet content modes:
# - bundled: chart creates a ConfigMap from deploy/helm/.../chiklets/*.json
# - existingConfigMap: mount an operator-managed ConfigMap
# - pvc: mount an existing PVC (recommended for live JSON + binary assets)
# - image: use /app/chiklets baked into the application image
chiklets:
  mode: bundled
  existingConfigMap: ""
  existingClaim: ""
  mountPath: /app/chiklets

web:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicaCount: 2
  concurrency: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 60

# Celery Beat must remain singleton with the current application architecture.
scheduler:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

migration:
  enabled: true
  activeDeadlineSeconds: 300
  backoffLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Optional one-time local break-glass administrator bootstrap. Credentials must
# be present in the existing Secret as BOOTSTRAP_ADMIN_USERNAME,
# BOOTSTRAP_ADMIN_PASSWORD and optionally BOOTSTRAP_ADMIN_EMAIL.
bootstrapAdmin:
  enabled: false
  activeDeadlineSeconds: 300
  backoffLimit: 1

# Ingress terminates TLS; do not run the Compose Nginx container in Kubernetes.
ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: selfservice.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: foreman-selfservice-tls

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Additional environment variables applied to web, worker and scheduler.
extraEnv: []

# Optional raw volumes/mounts for environment-specific integrations.
extraVolumes: []
extraVolumeMounts: []

# NetworkPolicy is disabled because LDAP, Entra, Foreman and PostgreSQL egress
# destinations are environment-specific. When enabled, it allows in-chart Redis.
networkPolicy:
  enabled: false
