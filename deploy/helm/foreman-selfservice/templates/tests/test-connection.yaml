apiVersion: v1
kind: Pod
metadata:
  name: {{ include "foreman-selfservice.fullname" . }}-test-connection
  labels:
    {{- include "foreman-selfservice.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      image: {{ include "foreman-selfservice.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - >-
          import urllib.request;
          r=urllib.request.urlopen('http://{{ include "foreman-selfservice.fullname" . }}:{{ .Values.web.service.port }}/health/ready', timeout=5);
          assert r.status == 200
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
