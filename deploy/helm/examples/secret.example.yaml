# EXAMPLE ONLY. Do not commit a real copy of this file to source control.
# Prefer External Secrets, Vault, Sealed Secrets or your platform secret store.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-selfservice-secrets
type: Opaque
stringData:
  SECRET_KEY: "replace-with-at-least-64-random-characters"

  # External production PostgreSQL.
  DATABASE_URL: "postgresql+psycopg://portal:CHANGE_ME@postgres.example.com:5432/portal?sslmode=require"

  # External production Redis. Separate DB numbers match the Compose defaults.
  REDIS_URL: "rediss://:CHANGE_ME@redis.example.com:6379/0"
  CELERY_BROKER_URL: "rediss://:CHANGE_ME@redis.example.com:6379/1"
  CELERY_RESULT_BACKEND: "rediss://:CHANGE_ME@redis.example.com:6379/2"

  ENTRA_CLIENT_SECRET: ""
  LDAP_BIND_PASSWORD: ""

  # Prefer a Foreman PAT. FOREMAN_PASSWORD can remain empty when using a PAT.
  FOREMAN_API_TOKEN: ""
  FOREMAN_PASSWORD: ""

  # Needed only when bootstrapAdmin.enabled=true or when running the bootstrap
  # command manually in a Pod.
  BOOTSTRAP_ADMIN_USERNAME: "portal-admin"
  BOOTSTRAP_ADMIN_PASSWORD: "replace-with-a-strong-unique-password"
  BOOTSTRAP_ADMIN_EMAIL: ""
