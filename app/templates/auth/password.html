{% extends "base.html" %}
{% block title %}Change password · Foreman Self-Service{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('auth.profile') }}">← My profile</a>
<section class="card password-card">
  <h1>Change your password</h1>
  <p class="muted">Local account: <strong>{{ current_user.username }}</strong>. You will sign in again after changing it.</p>
  <form method="post" action="{{ url_for('auth.change_password') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="14" maxlength="256" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="14" maxlength="256" required></label>
    <button class="button primary">Change password</button>
  </form>
</section>
{% endblock %}
